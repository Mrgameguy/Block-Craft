    if(q>=40&&q<80){const p=propAt(X,Y,Z);if(p){if(p.key==='tnt'&&!p.st.lit){igniteTnt(p,.25+R()*.3)}else{delProp(X,Y,Z);if(p.def.item&&R()<.5)collect(p.def.item,1)}}if(!(p&&p.key==='tnt'&&p.st.lit))put(X,Y,Z,0)}else{if(R()<.22&&!CREATIVE)harvest(q);if(isOn('phys')&&R()<.2)MH.emit('break',X,Y,Z,q);put(X,Y,Z,0)}
